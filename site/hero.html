<section class="home-hero" aria-labelledby="home-title">
  <figure class="light-scene">
    <div class="room-stage">
      <img id="scene-image" src="/scenes/lusar-room-ararat-off.webp" width="1672" height="941" fetchpriority="high" alt="Интерьер с массивным каменным столом, подвесом на потолке, настенными бра и видом на Арарат">
      <div class="room-light" data-light="pendant" aria-hidden="true"></div>
      <div class="room-light" data-light="left" aria-hidden="true"></div>
      <div class="room-light" data-light="right" aria-hidden="true"></div>
      <div class="room-light" data-light="floor" aria-hidden="true"></div>
      <div class="room-light" data-light="strip" aria-hidden="true"></div>
      <svg class="window-curtain" viewBox="0 0 1672 941" aria-hidden="true" focusable="false">
        <defs>
          <linearGradient id="curtain-fold"><stop stop-color="#0c1013"/><stop offset=".2" stop-color="#242a2e"/><stop offset=".43" stop-color="#42484c"/><stop offset=".58" stop-color="#353c41"/><stop offset=".8" stop-color="#181e22"/><stop offset="1" stop-color="#090d10"/></linearGradient>
          <linearGradient id="curtain-shade" x2=".8" y2="1"><stop stop-color="#000" stop-opacity=".28"/><stop offset=".45" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".48"/></linearGradient>
        </defs>
        <g class="curtain-folds"></g>
      </svg>
      <label class="curtain-control" for="curtain-opening" hidden><span>Штора</span><output id="curtain-value" for="curtain-opening">0%</output><input id="curtain-opening" type="range" min="0" max="100" value="0" aria-label="Закрытие шторы"></label>
      <div class="room-hotspots" hidden role="group" aria-label="Выберите один или несколько светильников">
        <button type="button" class="light-pin" data-fixture="pendant" style="--x:68%;--y:34%" aria-label="Подвес" aria-controls="light-editor" aria-pressed="true"><span class="pin-mark" aria-hidden="true"></span><span class="pin-label">Подвес</span></button>
        <button type="button" class="light-pin" data-fixture="left" style="--x:53.5%;--y:44%" aria-label="Левое бра" aria-controls="light-editor" aria-pressed="false"><span class="pin-mark" aria-hidden="true"></span><span class="pin-label">Левое бра</span></button>
        <button type="button" class="light-pin" data-fixture="right" style="--x:86%;--y:44%" aria-label="Правое бра" aria-controls="light-editor" aria-pressed="false"><span class="pin-mark" aria-hidden="true"></span><span class="pin-label">Правое бра</span></button>
        <button type="button" class="light-pin" data-fixture="floor" style="--x:95.5%;--y:41%" aria-label="Торшер" aria-controls="light-editor" aria-pressed="false"><span class="pin-mark" aria-hidden="true"></span><span class="pin-label">Торшер</span></button>
        <button type="button" class="light-pin" data-fixture="strip" style="--x:81%;--y:63%" aria-label="Подсветка консоли" aria-controls="light-editor" aria-pressed="false"><span class="pin-mark" aria-hidden="true"></span><span class="pin-label">Подсветка консоли</span></button>
      </div>
    </div>
    <div class="hero-copy">
      <span class="hero-eyebrow">LUSAR · Искусство света</span><h1 id="home-title">Свет в вашем ритме</h1>
      <p class="lead">Выразительный над столом.<br>Мягкий у любимого кресла.</p>
      <p class="hero-description">Найдите свет для каждого момента. Меняйте атмосферу в этом интерьере или примерьте светильник в своей комнате с Lusar AI.</p>
      <div class="hero-actions"><a class="button-link" href="/catalog">Открыть каталог</a><a class="ai-action" href="/ai"><span class="ai-orbit" aria-hidden="true">✧</span><span><span class="ai-gradient">Lusar AI</span><small>Примерить в своей комнате</small></span></a></div>
    </div>
    <figcaption class="room-console" hidden>
      <div class="scene-presets"><span class="console-label">Создайте свою атмосферу</span>
        <div id="scene-controls" role="group" aria-label="Сценарий освещения">
          <button type="button" data-scene="morning" aria-pressed="false">Утро</button><button type="button" data-scene="day" aria-pressed="true">День</button><button type="button" data-scene="evening" aria-pressed="false">Вечер</button>
          <button type="button" id="scene-power" role="switch" aria-checked="true" aria-label="Весь свет"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3v9m-5-7a8 8 0 1 0 10 0"/></svg></button>
        </div>
      </div>
      <div class="fixture-choices" role="group" aria-label="Светильники для регулировки"><button type="button" data-select-all>Выбрать все</button><span>Можно выбрать несколько</span></div>
      <div id="light-editor" class="light-editor" role="group" aria-labelledby="fixture-name">
        <div class="fixture-heading"><span id="fixture-name">Подвес</span><button type="button" id="fixture-power" role="switch" aria-checked="true" aria-label="Свет выбранных светильников"><span></span></button></div>
        <label class="light-slider" for="fixture-brightness"><span>Яркость</span><output id="brightness-value" for="fixture-brightness">90%</output><input id="fixture-brightness" type="range" min="0" max="100" value="90"></label>
        <label class="light-slider" for="fixture-temperature"><span>Температура света</span><output id="temperature-value" for="fixture-temperature">3800 K</output><input id="fixture-temperature" type="range" min="2700" max="6500" step="100" value="3800"></label>
      </div>
      <p id="scene-caption" role="status" aria-live="polite">Выберите светильники на фото и меняйте свет.</p><span class="scene-note">Художественная визуализация, не светотехнический расчёт.</span>
    </figcaption>
  </figure>
</section>
<script src="/scenes.js" defer></script>
