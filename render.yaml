services:
  - type: web
    name: lusar-staging
    runtime: python
    branch: lusar-next
    plan: free
    buildCommand: pip install -r site/requirements.txt && python site/build.py
    startCommand: python site/staging.py
    healthCheckPath: /healthz
    envVars:
      - key: LUSAR_STAGING_PASSWORD
        generateValue: true
      - key: LUSAR_YANDEX_METRICA_ID
        value: "114074884"
      - key: LUSAR_GA4_ID
        value: "G-DT02DVCBZF"
